[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barq-crs"
version = "0.6.0"
description = "Evidence-gated authorized security verification and cyber reasoning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "MEZ111"}]
dependencies = []
keywords = [
  "security",
  "authorization",
  "bola",
  "idor",
  "bug-bounty",
  "android",
  "variant-analysis",
  "openapi",
  "ctf",
  "sarif",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage>=7.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
barq = "barq_crs.cli:main"

[project.urls]
Homepage = "https://github.com/MEZ111/barq-crs"
Issues = "https://github.com/MEZ111/barq-crs/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

# Keep CI focused on correctness signals across the existing codebase. Formatting and
# import-order cleanup are intentionally separate from security/correctness gates.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/benchmark.py" = ["E402"]
"tests/test_mobile.py" = ["F401"]
"tests/test_traffic.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
